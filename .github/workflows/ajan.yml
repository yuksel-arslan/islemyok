# islemyok pazarlama/işletme ajanı — her Pazartesi 09:00 TSİ (06:00 UTC), elle: gh workflow run ajan.yml
# Repo checkout'lu gelir; push/PR yetkisi GITHUB_TOKEN'dan. Tek gizli: CLAUDE_CODE_OAUTH_TOKEN (claude setup-token).
name: ajan
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      not:
        description: "Bu koşuya özel not (isteğe bağlı)"
        required: false
        default: ""
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency: ajan
jobs:
  ajan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd worker && npm ci --omit=optional || npm install
      - name: Ajan
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Sen islemyok.com'un haftalık pazarlama/işletme ajanısın. Repo bu koşuda checkout'lu (main).
            `plan/AJAN.md`'yi oku ve adımları sırayla uygula: `plan/PLAN.md` takvimi ve `plan/DURUM.md`
            durumuna göre sırası gelen adımın ajan kısmını yap; `worker/` araçlarıyla haftalık anonim kanal
            kartını üret (`npm run kanal -- --discover`, `--fetch`, `--test --strict`; n<30 ise atla; ağ
            engelliyse DURUM.md'ye açıkça yaz, uydurma); `site/strateji-testleri.html` tablosuna ve
            `plan/kartlar/`a ekle; X metnini hazırla. `cd worker && npm test` geçince değişikliği
            `claude/ajan-<yıl>-<hafta>` dalına it ve PR aç (gh pr create); DURUM.md'ye PR bağlantısını yaz.
            Yüksel'den istenen en fazla tek satır, yalnız kimlik/ödeme/hesap için. Eşik/kural/ledger'a
            dokunma, kanal adı yayınlama, sinyal-grubu reklamı koyma. Bitince 5 satır özet.
            Koşuya özel not: ${{ github.event.inputs.not }}
          claude_args: >-
            --allowedTools "Bash(git *),Bash(gh *),Bash(npm *),Bash(node *),Bash(cd *),Read,Write,Edit,Glob,Grep"
            --max-turns 80
