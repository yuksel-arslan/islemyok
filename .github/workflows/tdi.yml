# TDI testi — Binance 1h ve 4h, 10 varlık, 40k bar, laboratuvar karar kuralı (worker/tdi.js başlığı).
# Elle: Actions → tdi → Run workflow. Sonuç: adım özeti + artifact.
name: tdi
on:
  workflow_dispatch:
  push:                    # GEÇİCİ: merge öncesi koşu. Merge'de silinecek.
    branches: [claude/optimistic-rubin-8ub650]
    paths: ["worker/tdi.js", ".github/workflows/tdi.yml"]
permissions:
  contents: read
concurrency: tdi
jobs:
  tdi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CACHE_DIR: ${{ github.workspace }}/.kl-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd worker && npm ci
      - uses: actions/cache/restore@v4
        with:
          path: .kl-cache
          key: kl-${{ github.run_id }}
          restore-keys: kl-
      - name: TDI 1h
        run: cd worker && node tdi.js --tf 1h --pages 40 --controls 50 --csv ../.kl-cache/tdi-1h.csv | tee ../.kl-cache/tdi-1h.txt
      - name: TDI 4h
        run: cd worker && node tdi.js --tf 4h --pages 40 --controls 50 --csv ../.kl-cache/tdi-4h.csv | tee ../.kl-cache/tdi-4h.txt
      - name: Özet
        if: always()
        run: '{ echo "\`\`\`"; cat .kl-cache/tdi-*.txt; echo "\`\`\`"; } >> "$GITHUB_STEP_SUMMARY"'
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .kl-cache
          key: kl-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tdi-sonuc
          path: .kl-cache/tdi-*
